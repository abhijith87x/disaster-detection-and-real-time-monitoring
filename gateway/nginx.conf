server {
    listen 443 ssl;
    server_name disaster-watch.duckdns.org;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html;

    location /socket.io/ {
        proxy_pass http://disaster-service:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/oauth/ {
        proxy_pass http://auth-service:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /auth/google/callback {
        proxy_pass http://auth-service:8000/auth/google/callback;
    }

    location /api/disaster/ {
        proxy_pass http://disaster-service:8000/;
    }

    location /api/chatbot/ {
        proxy_pass http://chatbot-service:8000/;
    }
}